# A generic, single database configuration for LifeLine AI.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path prepended to sys.path
prepend_sys_path = .

# Path separator for prepend_sys_path and version_locations
path_separator = os
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Default connection string (overridden dynamically in env.py from app.config.get_settings)
sqlalchemy.url = sqlite:///backend/lifeline.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
