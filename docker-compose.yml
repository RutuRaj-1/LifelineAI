services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeline_db
      POSTGRES_USER: lifeline_user
      POSTGRES_PASSWORD: lifeline_secure_db_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline_user -d lifeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lifeline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lifeline-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://lifeline_user:lifeline_secure_db_password_2026@postgres:5432/lifeline_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: lifeline-prod-cryptographically-secure-jwt-secret-key-32bytes-min
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      STORAGE_BACKEND: local
      UPLOAD_DIR: /app/backend/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeline-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
